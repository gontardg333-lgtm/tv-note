<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#140f2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Mot pour la TV</title>
  <style>
    :root {
      --bg: #140f2b; --bg2: #24184d; --card: rgba(255,255,255,.07); --line: rgba(255,255,255,.14);
      --text: #f5f3ff; --muted: rgba(245,243,255,.6); --accent: #8b5cf6; --ok: #2dc653; --err: #ff5d5d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, Roboto, sans-serif;
      background: radial-gradient(130% 80% at 50% 0%, var(--bg2) 0%, var(--bg) 60%); background-color: var(--bg);
      color: var(--text); min-height: 100%;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 14px; max-width: 560px; margin: 0 auto;
      overscroll-behavior: none;
    }
    header { display: flex; align-items: center; justify-content: space-between; }
    h1 { font-size: 22px; font-weight: 700; }
    .pill { font-size: 12px; padding: 5px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--muted); }
    .pill.on { color: #c9f7d5; border-color: rgba(45,198,83,.5); }
    .pad {
      position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 22px; overflow: hidden;
      background: #0d0b1d; border: 1px solid var(--line); touch-action: none;
      box-shadow: inset 0 0 60px rgba(139,92,246,.12);
    }
    .pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .pad .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 15px; pointer-events: none; }
    .row { display: flex; gap: 10px; align-items: center; }
    .colors { justify-content: space-between; }
    .dot { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); cursor: pointer; transition: transform .15s ease; }
    .dot.sel { transform: scale(1.18); border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.18); }
    .tools { justify-content: space-between; }
    .sizes { display: flex; gap: 8px; }
    .size, .tool {
      height: 40px; min-width: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
      color: var(--text); font-size: 15px; display: inline-flex; align-items: center; justify-content: center; padding: 0 12px; cursor: pointer;
    }
    .size.sel { background: rgba(139,92,246,.35); border-color: var(--accent); }
    .size i { display: block; border-radius: 50%; background: currentColor; }
    input[type=text] {
      width: 100%; height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--card);
      color: var(--text); font-size: 16px; padding: 0 14px; outline: none;
    }
    input[type=text]:focus { border-color: var(--accent); }
    .send {
      height: 56px; border: 0; border-radius: 18px; font-size: 17px; font-weight: 700; color: #fff; cursor: pointer;
      background: linear-gradient(135deg, #8b5cf6, #ec4899); box-shadow: 0 10px 30px rgba(139,92,246,.35);
      transition: transform .1s ease, opacity .2s ease;
    }
    .send:active { transform: scale(.98); }
    .send:disabled { opacity: .5; }
    .msg { min-height: 20px; text-align: center; font-size: 14px; color: var(--muted); }
    .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
    .nopair { display: none; text-align: center; padding: 40px 16px; color: var(--muted); line-height: 1.5; }
    body.unpaired .nopair { display: block; }
    body.unpaired main { display: none; }
    main { display: flex; flex-direction: column; gap: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>Laisser un mot</h1>
    <span id="pill" class="pill">TV</span>
  </header>

  <div class="nopair">Ouvre cette page en scannant le QR code sur la TV<br>(bouton <b style="color:#e5383b">rouge</b> de la télécommande).</div>

  <main>
    <div id="pad" class="pad"><canvas id="cv"></canvas><div id="ph" class="ph">Dessine ici ✍️</div></div>

    <div id="colors" class="row colors"></div>

    <div class="row tools">
      <div id="sizes" class="sizes"></div>
      <div class="row">
        <button id="undo" class="tool" aria-label="Annuler">↶</button>
        <button id="clear" class="tool" aria-label="Effacer">🗑</button>
      </div>
    </div>

    <input id="text" type="text" maxlength="80" placeholder="Petit texte (optionnel)">
    <input id="from" type="text" maxlength="24" placeholder="Ton prénom (optionnel)">

    <button id="send" class="send">Envoyer à la TV</button>
    <div id="msg" class="msg"></div>
  </main>

  <script>
  (() => {
    'use strict';
    const NTFY = 'https://ntfy.sh';
    const W = 1000, H = 750;                       // shared coordinate space with the TV
    const COLORS = ['#ffffff', '#ffd60a', '#ff9f1c', '#ff4d6d', '#e5383b', '#c77dff', '#4cc9f0', '#2dc653'];
    const SIZES = [6, 12, 22];
    const $ = (id) => document.getElementById(id);
    const ls = {
      get: (k) => { try { return localStorage.getItem('note.' + k); } catch { return null; } },
      set: (k, v) => { try { localStorage.setItem('note.' + k, v); } catch { /* private mode */ } },
    };

    // Pairing: topic comes from the QR (#t=...), remembered afterwards.
    const fromHash = new URLSearchParams(location.hash.slice(1)).get('t');
    if (fromHash && /^tvn-[a-z0-9]{24}$/.test(fromHash)) ls.set('topic', fromHash);
    const topic = ls.get('topic');
    if (!topic) { document.body.classList.add('unpaired'); return; }
    // Keep the topic in the URL so "Add to Home Screen" (separate storage on iOS) stays paired.
    if (fromHash !== topic) history.replaceState(null, '', '#t=' + topic);
    $('pill').textContent = 'TV connectée'; $('pill').classList.add('on');

    let color = COLORS[0], size = SIZES[1];
    const strokes = [];
    let cur = null;

    COLORS.forEach((c) => {
      const d = document.createElement('div');
      d.className = 'dot' + (c === color ? ' sel' : '');
      d.style.background = c;
      d.onclick = () => { color = c; [...$('colors').children].forEach((x) => x.classList.toggle('sel', x === d)); };
      $('colors').appendChild(d);
    });
    SIZES.forEach((s) => {
      const b = document.createElement('button');
      b.className = 'size' + (s === size ? ' sel' : '');
      b.setAttribute('aria-label', 'Taille ' + s);
      const i = document.createElement('i'); i.style.width = i.style.height = (4 + s / 2) + 'px';
      b.appendChild(i);
      b.onclick = () => { size = s; [...$('sizes').children].forEach((x) => x.classList.toggle('sel', x === b)); };
      $('sizes').appendChild(b);
    });
    $('from').value = ls.get('from') || '';

    // Canvas
    const cv = $('cv'), ctx = cv.getContext('2d');
    const fit = () => {
      const r = cv.getBoundingClientRect(), dpr = Math.min(3, window.devicePixelRatio || 1);
      cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
      redraw();
    };
    const drawStroke = (s) => {
      const k = cv.width / W, p = s.p, n = p.length / 2;
      ctx.strokeStyle = ctx.fillStyle = s.c; ctx.lineWidth = s.w * k; ctx.lineCap = ctx.lineJoin = 'round';
      if (n === 1) { ctx.beginPath(); ctx.arc(p[0] * k, p[1] * k, s.w * k / 2, 0, Math.PI * 2); ctx.fill(); return; }
      ctx.beginPath(); ctx.moveTo(p[0] * k, p[1] * k);
      for (let i = 1; i < n - 1; i++) {
        const x = p[i * 2], y = p[i * 2 + 1];
        ctx.quadraticCurveTo(x * k, y * k, (x + p[i * 2 + 2]) / 2 * k, (y + p[i * 2 + 3]) / 2 * k);
      }
      ctx.lineTo(p[(n - 1) * 2] * k, p[(n - 1) * 2 + 1] * k); ctx.stroke();
    };
    const redraw = () => {
      ctx.clearRect(0, 0, cv.width, cv.height);
      strokes.forEach(drawStroke);
      if (cur) drawStroke(cur);
      $('ph').style.display = strokes.length || cur ? 'none' : '';
    };
    const pt = (e) => {
      const r = cv.getBoundingClientRect();
      return [Math.round(Math.max(0, Math.min(W, (e.clientX - r.left) / r.width * W))),
              Math.round(Math.max(0, Math.min(H, (e.clientY - r.top) / r.height * H)))];
    };
    cv.addEventListener('pointerdown', (e) => {
      cv.setPointerCapture(e.pointerId);
      cur = { c: color, w: size, p: pt(e) };
      redraw();
    });
    cv.addEventListener('pointermove', (e) => {
      if (!cur) return;
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      evs.forEach((ev) => {
        const [x, y] = pt(ev), n = cur.p.length;
        if (Math.abs(x - cur.p[n - 2]) + Math.abs(y - cur.p[n - 1]) >= 2) cur.p.push(x, y);
      });
      redraw();
    });
    const end = () => { if (!cur) return; strokes.push({ ...cur, p: simplify(cur.p, 1.2) }); cur = null; redraw(); };
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);
    window.addEventListener('resize', fit);

    // Ramer–Douglas–Peucker on a flat [x,y,x,y...] array.
    function simplify(p, eps) {
      const n = p.length / 2;
      if (n < 3) return p;
      const keep = new Uint8Array(n); keep[0] = keep[n - 1] = 1;
      const stack = [[0, n - 1]];
      while (stack.length) {
        const [a, b] = stack.pop();
        const ax = p[a * 2], ay = p[a * 2 + 1], bx = p[b * 2], by = p[b * 2 + 1];
        const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1;
        let best = -1, idx = -1;
        for (let i = a + 1; i < b; i++) {
          const d = Math.abs(dy * p[i * 2] - dx * p[i * 2 + 1] + bx * ay - by * ax) / len;
          if (d > best) { best = d; idx = i; }
        }
        if (best > eps) { keep[idx] = 1; stack.push([a, idx], [idx, b]); }
      }
      const out = [];
      for (let i = 0; i < n; i++) if (keep[i]) out.push(p[i * 2], p[i * 2 + 1]);
      return out;
    }

    $('undo').onclick = () => { strokes.pop(); redraw(); };
    $('clear').onclick = () => { strokes.length = 0; redraw(); };

    const say = (t, cls) => { $('msg').textContent = t; $('msg').className = 'msg ' + (cls || ''); };
    $('send').onclick = async () => {
      const text = $('text').value.trim(), from = $('from').value.trim();
      if (!strokes.length && !text) { say('Dessine ou écris quelque chose d\'abord', 'err'); return; }
      ls.set('from', from);
      const body = JSON.stringify({ v: 1, from, text, strokes });
      $('send').disabled = true; say('Envoi…');
      try {
        const r = await fetch(`${NTFY}/${topic}`, { method: 'PUT', headers: { Filename: 'note.json' }, body });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        say('Envoyé ✓ — regarde la TV', 'ok');
        if (navigator.vibrate) navigator.vibrate(30);
      } catch (err) {
        say('Échec de l\'envoi (' + err.message + '). Réessaie.', 'err');
      } finally {
        $('send').disabled = false;
      }
    };

    fit();
  })();
  </script>
</body>
</html>
